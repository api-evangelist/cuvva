aid: cuvva
name: Cuvva
description: >-
  Cuvva is a UK insurtech that pioneered flexible, short-term car and van
  insurance sold entirely through its mobile apps. Founded in 2015 as the first
  app to sell temporary car insurance in the UK, it offers policies from one hour
  up to 28 days, learner-driver cover, drive-away cover for newly purchased
  vehicles, temporary van and motorhome insurance, and a rolling subscription
  product (formerly Flexi). Cuvva is FCA-authorised and has sold over 16 million
  policies to 1.7M+ drivers. Its engineering is built on a fleet of small
  single-purpose service APIs (auth, vehicle, MOT, motor-coverage, billing, promo,
  profile, upload, terms, notification and more), publicly documented on GitHub and
  secured with an in-house OAuth 2.0 implementation using JWT bearer tokens.
