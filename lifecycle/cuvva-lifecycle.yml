    (2017-05-09, 2018-03-06, 2018-12-11, 2020-06-02, ...) some of which are aliases
    for app compatibility; other services carry a numeric version in the path
    (/service-auth/2, /service-mot/1). Per-service changelogs document breaking vs
    non-breaking changes.
